/* Fintech visual refresh */
:root{--primary:#2563eb;--soft:#eff6ff;--shadow:0 10px 32px rgba(15,23,42,.06)}

.btn,.icon-btn,.theme-btn{border-radius:12px}

  --yellow:#d97706;
  --shadow:0 8px 28px rgba(15,23,42,.055);
  --shadow-hover:0 12px 34px rgba(15,23,42,.09);
}
[data-theme="dark"]{
  --bg:#090f1d;
  --card:#111827;
  --text:#f4f7fb;
  --muted:#98a3b5;
  --border:#263246;
  --primary:#60a5fa;
  --primary-hover:#93c5fd;
  --soft:#172554;
  --green:#34d399;
  --red:#f87171;
  --yellow:#fbbf24;
  --shadow:0 8px 28px rgba(0,0,0,.22);
  --shadow-hover:0 12px 34px rgba(0,0,0,.32);
}

html,body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  letter-spacing:-.012em;
}

/* Desktop navigation */
aside{
  width:252px;
  padding:24px 16px;
  background:color-mix(in srgb,var(--card) 97%,var(--bg));
  border-right:1px solid var(--border);
  box-shadow:4px 0 24px rgba(15,23,42,.025);
}
.brand{
  padding:7px 10px 26px;
  font-size:20px;
  letter-spacing:-.025em;
}
.brand svg{width:21px;height:21px;stroke-width:2.1}
nav button{
  min-height:44px;
  padding:11px 13px;
  margin:3px 0;
  border-radius:12px;
  font-size:13px;
  font-weight:500;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
nav button svg{width:18px;height:18px;stroke-width:1.9}
nav button:hover{transform:none}
nav button.active{
  font-weight:650;
  box-shadow:inset 3px 0 0 var(--primary);
}

/* Main content */
main{
  margin-left:252px;
  width:calc(100% - 252px);
  max-width:1580px;
  padding:34px 36px;
}
.topbar{
  margin-bottom:26px;
}
h1{
  font-size:30px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
}
.subtitle{
  font-size:13px;
  line-height:1.5;
}

/* Buttons */
.btn,.icon-btn,.theme-btn{
  border-radius:11px;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn{
  min-height:40px;
  padding:9px 14px;
  font-size:13px;
  font-weight:600;
}
.btn.primary{
  box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 20%,transparent);
}
.btn.primary:hover{
  background:var(--primary-hover);
  border-color:var(--primary-hover);
  transform:translateY(-1px);
}
.icon-btn{
  min-width:36px;
  min-height:36px;
}
.icon-btn:hover{
  background:var(--soft);
  border-color:color-mix(in srgb,var(--primary) 28%,var(--border));
}

/* Summary cards */
.cards{
  gap:14px;
}
.cards>.card{
  min-width:0;
}
.card{
  padding:20px;
  border-radius:18px;
  border-color:var(--border);
  box-shadow:var(--shadow);
  transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;
}
.card:hover{
  border-color:color-mix(in srgb,var(--primary) 12%,var(--border));
}
.stat-label{
  font-size:12px;
  font-weight:550;
  letter-spacing:0;
}
.stat-value{
  margin-top:8px;
  font-size:25px;
  line-height:1.15;
  font-weight:500;
  letter-spacing:-.03em;
}

/* Section hierarchy */
.section-grid{
  gap:16px;
  margin-top:16px;
}
.section-title{
  margin-bottom:14px;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.018em;
}
.small{
  line-height:1.45;
}

/* Accounts */
.account{
  padding:12px;
  border-radius:13px;
  background:color-mix(in srgb,var(--card) 97%,var(--soft));
}
.account:hover{
  border-color:color-mix(in srgb,var(--primary) 20%,var(--border));
}
.account-icon{
  width:38px;
  height:38px;
  border-radius:11px;
}
.amount{
  font-weight:500;
  letter-spacing:-.02em;
}

/* Forms */
.form-grid{gap:14px}
.field label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  text-transform:none;
}
.field input,.field select{
  min-height:42px;
  padding:10px 12px;
  border-radius:11px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input:focus,.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent);
}
.form-actions{margin-top:16px}

/* Tables */
.table-wrap{
  width:100%;
  max-width:100%;
}
.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
}
.table th,.table td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.table th{
  font-size:11px;
  font-weight:650;
  letter-spacing:.01em;
  color:var(--muted);
}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{
  background:color-mix(in srgb,var(--soft) 45%,transparent);
}
.badge{
  padding:4px 8px;
  font-size:10px;
  font-weight:600;
}

/* Dashboard recent activity + category panel */
.recent-overview-grid{
  gap:22px;
}
.category-overview{
  padding-left:20px;
}
.category-overview-title{
  font-size:13px;
  margin-bottom:13px;
}
.category-item{
  margin-bottom:12px;
}
.category-item-top{
  font-size:12px;
}
.category-bar{
  height:6px;
}

/* Quick actions */
.quick-grid{gap:11px}
.quick-btn{
  min-height:108px;
  border-radius:15px;
  padding:14px 11px;
  box-shadow:none;
}
.quick-btn strong{
  font-size:13px;
  font-weight:650;
}
.quick-btn .small{font-size:10px}

/* DealPlug card */
.dealplug-dashboard-card{
  overflow:hidden;
}
.dealplug-dashboard-card .stat-value{
  font-size:24px;
}

/* Monthly account snapshots */
.account-snapshots-card{
  max-width:920px;
}
.snapshot-month{
  border-radius:13px;
  padding:11px 13px;
}
.snapshot-input-wrap{
  width:115px;
  min-height:36px;
  border-radius:9px;
}
.snapshot-input-wrap input{
  font-size:13px;
}

/* Backup / theme controls */
.bottom-tools{
  left:16px;
  right:16px;
  bottom:18px;
}
.theme-btn{
  min-height:40px;
  padding:9px 11px;
  font-size:12px;
  font-weight:550;
}
.theme-btn:hover{
  background:var(--soft);
}

/* Mobile app */
@media(max-width:700px){
  aside{display:none}
  main{
    margin:0;
    width:100%;
    max-width:none;
    padding:17px 14px calc(96px + env(safe-area-inset-bottom));
  }
  .mobile-head{
    margin-bottom:18px;
  }
  .mobile-head .brand{
    padding:0;
    font-size:18px;
  }

<script>
"use strict";

const STORAGE_KEY="budgetPlannerV2";
const DEFAULT_ACCOUNTS=[
{id:"acc1",name:"ABN Betaalrekening",type:"betaal",balance:0,icon:"wallet"},
{id:"acc2",name:"ABN Amro",type:"spaar",balance:0,icon:"piggy-bank"},
{id:"acc3",name:"Revolut Betaalrekening",type:"revolut-betaal",balance:0,icon:"credit-card"},
{id:"acc4",name:"Revolut",type:"revolut-spaar",balance:0,icon:"landmark"}
];
const categories=["Wonen","Boodschappen","Auto","Benzine","Vervoer","Abonnementen","Uit eten","Entertainment","Kleding","Vakantie","Gezondheid","Sport","Verzekeringen","Belastingen","Salaris","Freelance","Sparen","Overig"];
const quickExpenses=[["Boodschappen","shopping-cart"],["Tanken","fuel"],["Uit eten","utensils"],["Abonnement","credit-card"],["Kleding","shirt"],["Vervoer","car"],["Entertainment","gamepad-2"],["Vakantie","plane"],["Gezondheid","heart-pulse"],["Overig","more-horizontal"],["Crypto","bitcoin"]];

function freshData(){
return {theme:"light",cryptoEnabled:true,crypto:0,cryptoEntries:[],accounts:structuredClone(DEFAULT_ACCOUNTS),transactions:[],budgets:[],goals:[],recurring:[],weeklySalary:{enabled:false,amount:0,accountId:"",description:"Wekelijks loon"},dealplug:{opening:0,entries:[]},processedRecurring:{},accountSnapshots:{}};
}
function loadData(){
let raw=null;
try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){}
if(!raw){
  try{
    const old=JSON.parse(localStorage.getItem("budgetPlannerV1")||"null");
    if(old) raw=old;
  }catch(e){}
}
const d=raw||freshData();
d.theme=d.theme==="dark"?"dark":"light";
d.cryptoEnabled=typeof d.cryptoEnabled==="boolean"?d.cryptoEnabled:true;
d.crypto=Number(d.crypto)||0;
d.accounts=Array.isArray(d.accounts)&&d.accounts.length?d.accounts:structuredClone(DEFAULT_ACCOUNTS);
const rename={"Betaalrekening":"ABN Betaalrekening","Spaarrekening":"ABN Amro","ABN Spaarrekening":"ABN Amro","Revolut Spaarrekening":"Revolut"};
d.accounts.forEach(a=>{if(rename[a.name])a.name=rename[a.name];a.balance=Number(a.balance)||0});
const savings=d.accounts.filter(a=>a.type==="spaar"||a.type==="revolut-spaar"||/spaarrekening/i.test(a.name));
d.accounts=savings.length?savings:[structuredClone(DEFAULT_ACCOUNTS[1])];
d.transactions=Array.isArray(d.transactions)?d.transactions:[];
d.budgets=Array.isArray(d.budgets)?d.budgets:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.recurring=Array.isArray(d.recurring)?d.recurring:[];
d.cryptoEntries=Array.isArray(d.cryptoEntries)?d.cryptoEntries:[];
  d.cryptoEntries.forEach(e=>{if(!e.assetType)e.assetType="crypto"});
d.dealplug=d.dealplug&&typeof d.dealplug==="object"?d.dealplug:{opening:0,entries:[]};
d.dealplug.opening=Number(d.dealplug.opening)||0;
d.dealplug.entries=Array.isArray(d.dealplug.entries)?d.dealplug.entries:[];
d.weeklySalary=d.weeklySalary&&typeof d.weeklySalary==="object"?d.weeklySalary:{enabled:false,amount:0,accountId:d.accounts[0]?.id||"",description:"Wekelijks loon"};
d.weeklySalary.enabled=!!d.weeklySalary.enabled;
d.weeklySalary.amount=Number(d.weeklySalary.amount)||0;
d.weeklySalary.accountId=(d.accounts.some(a=>a.id===d.weeklySalary.accountId)?d.weeklySalary.accountId:d.accounts[0]?.id)||"";
d.processedRecurring=d.processedRecurring&&typeof d.processedRecurring==="object"?d.processedRecurring:{};
d.accountSnapshots=d.accountSnapshots&&typeof d.accountSnapshots==="object"?d.accountSnapshots:{};
return d;
}
let data=loadData();
let activeView="dashboard";
let amountsVisible=true;
let currentMonth=new Date();
currentMonth.setDate(1);

const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const protectedEuro=n=>amountsVisible?euro(n):"••••••";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const monthKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`};
const monthName=()=>currentMonth.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
const today=()=>{const x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const accountById=id=>data.accounts.find(a=>a.id===id);
const monthTransactions=()=>data.transactions.filter(t=>monthKey(t.date)===monthKey(currentMonth));

function persist(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function saveAndRender(){persist();render();}
function notify(msg){alert(msg);}

function setActiveView(view){
activeView=view;
document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===view));
document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
}
function navEvents(){
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setActiveView(b.dataset.view)));
}
function themeToggle(){data.theme=data.theme==="dark"?"light":"dark";saveAndRender();}
function setupGlobalControls(){
$("themeBtn").onclick=themeToggle;
$("mobileTheme").onclick=themeToggle;
}

function processRecurringTransactions(){
const now=new Date();
const realMonth=monthKey(now);
const day=now.getDate();
let changed=false;
data.recurring.forEach(r=>{
const marker=realMonth+"_"+r.id;
if(data.processedRecurring[marker])return;
if(day<Number(r.day||1))return;
const acc=accountById(r.accountId);
if(!acc)return;
const amount=Number(r.amount)||0;
if(amount<=0)return;
if(r.kind==="expense"&&acc.balance<amount)return;
const txDate=new Date(now.getFullYear(),now.getMonth(),Number(r.day||1));
const tx={id:uid(),description:r.description,amount,date:dateKey(txDate),category:r.category,accountId:r.accountId,kind:r.kind,recurringId:r.id};
data.transactions.push(tx);
acc.balance += r.kind==="income"?amount:-amount;
data.processedRecurring[marker]=true;
changed=true;
});
if(changed)persist();
}

function render(){
document.documentElement.dataset.theme=data.theme;
$("crypto").style.display="";
renderDashboard();renderTransactions();renderAccounts();renderCrypto();renderDealPlug();renderGoals();renderRecurring();
setActiveView(activeView);
lucide.createIcons();
}

function valForDashboard(type,snapshot){
  if(type==="private") return revolutPrivateBalance(snapshot);
  return 0;
}

function monthlyAccountEffect(month,ids){
  const ts=Array.isArray(data.transactions)?data.transactions:[];
  return ts.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
    const amount=Number(t.amount||0);
    if(t.kind==="income" && ids.includes(t.accountId)) return sum+amount;
    if(t.kind==="expense" && ids.includes(t.accountId)) return sum-amount;
    if(t.kind==="transfer"){
      if(ids.includes(t.accountId)) sum-=amount;
      if(ids.includes(t.toAccountId)) sum+=amount;
    }
    return sum;
  },0);
}

function displayedAccountBalances(month){
  const key=month||monthKey(currentMonth);
  const snap=data.accountSnapshots?.[key]||{};

  // Actuele saldi zijn leidend voor het scherm. De maandstand blijft alleen
  // de historische referentie en wordt nooit aangepast door overboekingen.
  // ABN en Revolut privé hebben een echte account-balance; DealPlug/Crypto
  // worden vanuit hun maandstand + mutaties berekend.
  const abnAccount=accountById("acc2");
  const revolutAccount=accountById("acc4");
  const realCurrentMonth=monthKey(new Date());
  const isCurrentMonth=key===realCurrentMonth;

  // Voor de huidige maand gebruiken we de actuele rekeningstatus.
  // Voor historische maanden gebruiken we juist de opgeslagen maandstand.
  // Zo overschrijft een actuele rekeningstand nooit een eerder opgeslagen maandstand.
  const abn=isCurrentMonth && abnAccount
    ? Number(abnAccount.balance||0)
    : Number(snap.acc1||0);

  const privateRevolut=isCurrentMonth && revolutAccount
    ? Number(revolutAccount.balance||0)
    : Number(snap.acc4||0);

  const monthTransfers=(Array.isArray(data.transactions)?data.transactions:[])
    .filter(t=>t.kind==="revolutTransfer" && (t.month===key || monthKey(t.date)===key));

  const dealplugBase=Number(snap.revolutSubaccounts?.dealplug||0);
  const cryptoBase=Number(snap.revolutSubaccounts?.crypto||0);

  const dealplugTransfers=monthTransfers.reduce((sum,t)=>{
    const n=Number(t.amount||0);
    if(t.fromTarget==="dealplug") return sum-n;
    if(t.toTarget==="dealplug") return sum+n;
    return sum;
  },0);
  const cryptoTransfers=monthTransfers.reduce((sum,t)=>{
    const n=Number(t.amount||0);
    if(t.fromTarget==="crypto") return sum-n;
    if(t.toTarget==="crypto") return sum+n;
    return sum;
  },0);

  const dealplug=dealplugBase+dealplugTransfers+dealplugNetForMonth(key);
  const crypto=cryptoBase+cryptoTransfers;
  const revolut=privateRevolut+dealplug+crypto;

  return {abn,privateRevolut,dealplug,crypto,revolut,total:abn+revolut};
}

function renderDashboard(){
const ts=monthTransactions();
const incomeTransactions=ts.filter(t=>t.kind==="income").reduce((s,t)=>s+Number(t.amount),0);
const expenseTransactions=ts.filter(t=>t.kind==="expense").reduce((s,t)=>s+Number(t.amount),0);
const dealplugMonthEntries=Array.isArray(data.dealplug?.entries)
  ? data.dealplug.entries.filter(e=>monthKey(e.date)===monthKey(currentMonth))
  : [];
const dealplugMonthIncome=dealplugMonthEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
const dealplugMonthCosts=dealplugMonthEntries.filter(e=>e.kind==="expense"||e.kind==="cost"||e.kind==="kosten").reduce((s,e)=>s+Number(e.amount||0),0);
// DealPlugNL-verkopen en inkopen/kosten tellen mee in de maandtotalen op het dashboard.
const income=incomeTransactions+dealplugMonthIncome;
const expenses=expenseTransactions+dealplugMonthCosts;
const dashboardSnapshotKey=monthKey(currentMonth);
const dashboardSnapshot=data.accountSnapshots?.[dashboardSnapshotKey]||{};
const hasDashboardSnapshot=Object.prototype.hasOwnProperty.call(dashboardSnapshot,"acc1")||Object.prototype.hasOwnProperty.call(dashboardSnapshot,"acc4");
const accountStand=hasDashboardSnapshot
  ? Number(dashboardSnapshot.acc1||0)+revolutTotal(dashboardSnapshot,dashboardSnapshotKey)
  : data.accounts.reduce((s,a)=>s+Number(a.balance),0);
// Beschikbaar geld = opgeslagen maandstand + inkomsten - uitgaven.
// De handmatige rekeningstand zelf blijft ongewijzigd door transacties.
const cash=accountStand+(incomeTransactions-expenseTransactions);
const net=income-expenses;
// Laat gewone transacties ook direct terugkomen in de weergegeven rekeningstand.
// Het maandelijkse snapshot blijft het uitgangspunt; de transacties van deze maand worden daarop toegepast.
const displayedBalances=displayedAccountBalances(dashboardSnapshotKey);
const dashboardAbnBalance=displayedBalances.abn;
const dashboardRevolutBalance=displayedBalances.revolut;
const dealplugEntries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
const dpIncome=dealplugEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
const dpCosts=dealplugEntries.filter(e=>e.kind==="expense"||e.kind==="cost"||e.kind==="kosten").reduce((s,e)=>s+Number(e.amount||0),0);
const dpBalance=Number(data.dealplug.opening)+dpIncome-dpCosts;
const dashboardCryptoEntries=Array.isArray(data.cryptoEntries)?data.cryptoEntries:[];
const dashboardCryptoInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoResult=dashboardCryptoCashouts-dashboardCryptoInvested;
const dashboardCryptoOpen=Math.max(0,dashboardCryptoInvested-dashboardCryptoCashouts);
const dashboardPokemonInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonResult=dashboardPokemonCashouts-dashboardPokemonInvested;
const dashboardPokemonOpen=Math.max(0,dashboardPokemonInvested-dashboardPokemonCashouts);
const recent=[...ts].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);

const dashboardSnapshotLabel=new Date(Number(dashboardSnapshotKey.slice(0,4)),Number(dashboardSnapshotKey.slice(5,7))-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
$("dashboard").innerHTML=`
<div class="topbar"><div><h1>Dashboard</h1><div class="subtitle">Je financiële overzicht</div></div>
<div class="month-nav"><button class="icon-btn" id="prevMonth"><i data-lucide="chevron-left"></i></button><strong style="min-width:145px;text-align:center;text-transform:capitalize">${monthName()}</strong><button class="icon-btn" id="nextMonth"><i data-lucide="chevron-right"></i></button></div></div>

  const previousDate=new Date(currentMonth);
  previousDate.setMonth(previousDate.getMonth()-1);
  const previousKey=monthKey(previousDate);
  const previousSnapshot=data.accountSnapshots?.[previousKey];
  if(!previousSnapshot){
    return '<div class="account-change flat"><i data-lucide="minus"></i><span>Geen vorige maand beschikbaar</span></div>';
  }
  const previousTotal=Number(previousSnapshot.acc1||0)+revolutTotal(previousSnapshot,previousKey);
  const difference=currentTotal-previousTotal;
  if(difference>0){
    return `<div class="account-change up"><i data-lucide="trending-up"></i><span>${protectedEuro(difference)} meer dan vorige maand</span></div>`;
  }
  if(difference<0){
    return `<div class="account-change down"><i data-lucide="trending-down"></i><span>${protectedEuro(Math.abs(difference))} minder dan vorige maand</span></div>`;
  }
  return '<div class="account-change flat"><i data-lucide="minus"></i><span>Gelijk aan vorige maand</span></div>';

function quickExpense(category,amount,description){
  // Snelle uitgaven worden net als gewone uitgaven van de
  // ABN Amro spaarrekening afgeboekt.
  const savingsAccount=accountById("acc2");
  if(!savingsAccount){notify("ABN Amro spaarrekening niet gevonden.");return}
  if(Number(savingsAccount.balance||0)<amount){
    notify(`Onvoldoende saldo op ${savingsAccount.name}. Beschikbaar: ${euro(savingsAccount.balance)}.`);
    return;
  }

  savingsAccount.balance-=amount;
  const tx={
    id:uid(),
    description:description||category,
    amount,
    date:today(),
    category,
    accountId:savingsAccount.id,
    kind:"expense",
    quickOnly:true
  };
  data.transactions.push(tx);
  saveAndRender();
}
function addWorkIncome(amount){
const acc=data.accounts[0];
if(!acc){notify("Geen spaarrekening gevonden.");return}
data.transactions.push({id:uid(),description:"Loon uit werk",amount,date:today(),category:"Salaris",accountId:acc.id,kind:"income"});
acc.balance+=amount;saveAndRender();
}
function addCryptoContribution(amount){
data.cryptoEntries.push({id:uid(),type:"in",amount,date:today(),description:"Crypto inleg"});
data.crypto=(Number(data.crypto)||0)+amount;saveAndRender();
}
function addDealPlugEntry(kind,amount,description){
data.dealplug.entries.push({id:uid(),kind,amount,date:today(),description});saveAndRender();
}

function transactionRow(t,full){
const acc=accountById(t.accountId);
const to=accountById(t.toAccountId);
const sign=t.kind==="income"?"+":t.kind==="transfer"||t.kind==="revolutTransfer"?"↔":t.kind==="revolutAdjustment"?(t.direction==="add"?"+":"-"):"-";
const cls=t.kind==="income"||t.kind==="revolutAdjustment"&&t.direction==="add"?"positive":t.kind==="expense"||t.kind==="revolutAdjustment"&&t.direction==="remove"?"negative":"";
const accountLabel=t.kind==="revolutAdjustment"?({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.target]||"Revolut"):t.kind==="revolutTransfer"?`${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.fromTarget]||"Revolut")} → ${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.toTarget]||"Revolut")}`:(t.quickOnly?"Uitgavenregistratie":(acc?.name||"-"));
const categoryLabel=t.kind==="revolutAdjustment"?"Revolut mutatie":t.category;
return `<tr><td>${esc(t.description)}</td><td><span class="badge">${esc(categoryLabel)}</span></td><td>${new Date(t.date).toLocaleDateString("nl-NL")}</td>${full?`<td>${esc(accountLabel)}${t.kind==="transfer"&&to?` → ${esc(to.name)}`:""}</td>`:""}<td class="${cls}">${sign}${euro(t.amount)}</td>${full?`<td><div class="actions"><button data-edit="${t.id}" title="Bewerken"><i data-lucide="pencil"></i></button><button data-delete="${t.id}" class="danger" title="Verwijderen"><i data-lucide="trash-2"></i></button></div></td>`:""}</tr>`;
}

$("transactionForm").onsubmit=e=>{
e.preventDefault();
const description=$("description").value.trim();
const amount=Number($("amount").value);
const date=$("date").value;
const accountId=$("account").value;
if(!description){notify("Vul een omschrijving in.");return}
if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
if(!date){notify("Kies een datum.");return}
if(kind==="transfer"){
const from=accountById(accountId),to=accountById($("transferTo").value);
if(!from||!to||from.id===to.id){notify("Kies twee verschillende rekeningen.");return}

// Gebruik voor de saldo-check dezelfde maandstanden als het dashboard.
// ABN Amro wordt in de maandstanden als acc1 opgeslagen, terwijl de
// transactiekeuze acc2 gebruikt. Revolut privé gebruikt acc4.
const month=monthKey(new Date(date));
const snap=data.accountSnapshots?.[month];
const transferEffect=(ids)=>data.transactions.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
  const n=Number(t.amount||0);
  if(t.kind==="income" && ids.includes(t.accountId)) return sum+n;
  if(t.kind==="expense" && ids.includes(t.accountId)) return sum-n;
  if(t.kind==="transfer"){
    if(ids.includes(t.accountId)) sum-=n;
    if(ids.includes(t.toAccountId)) sum+=n;
  }
  return sum;
},0);
// Gebruik exact hetzelfde actuele saldo als de rekeningtegels op het
// dashboard/transacties. Daardoor worden eerdere overboekingen meteen
// meegenomen in de volgende saldo-check.
const balancesBeforeTransfer=displayedAccountBalances(month);
const sourceBalance=from.id==="acc2"
  ? Number(balancesBeforeTransfer.abn||0)
  : from.id==="acc4"
    ? Number(balancesBeforeTransfer.privateRevolut||0)
    : Number(from.balance||0);
if(sourceBalance+0.000001<amount){
  notify(`Overboeking geweigerd: onvoldoende saldo op ${from.name}. Beschikbaar: ${euro(sourceBalance)}.`);
  return;
}

from.balance-=amount;
to.balance+=amount;

// Een overboeking verandert NOOIT de opgeslagen maandstand.
// De maandstand is een vast historisch meetpunt; de actuele rekeningstanden
// worden hierboven bijgewerkt en de overboeking blijft als transactie geregistreerd.
data.transactions.push({id:uid(),description,amount,date,category:"Overboeking",accountId:from.id,toAccountId:to.id,kind:"transfer"});
}else{
const acc=accountById(accountId);
if(!acc){notify("Kies een rekening.");return}

// Een gewone inkomsten-/kostentransactie verandert ook het actuele saldo
// van de gekozen rekening. De opgeslagen maandstand blijft een historisch
// snapshot; alleen de actuele maandrekening wordt live bijgewerkt.
const transactionMonth=monthKey(new Date(date));
if(transactionMonth===monthKey(new Date())){
  if(kind==="expense") {
    if(Number(acc.balance||0)+0.000001<amount){
      notify(`Transactie geweigerd: onvoldoende saldo op ${acc.name}. Beschikbaar: ${euro(acc.balance||0)}.`);
      return;
    }
    acc.balance-=amount;
  } else if(kind==="income") {
    acc.balance+=amount;
  }
}

data.transactions.push({id:uid(),description,amount,date,category:$("category").value,accountId,kind});
}
saveAndRender();
};
function changeRevolutSubaccountAmount(target, amount, direction, note){
  const n=Number(amount);
  if(!Number.isFinite(n)||n<=0){notify("Vul een geldig bedrag in.");return}
  const month=monthKey(currentMonth);
  data.accountSnapshots=data.accountSnapshots||{};
  const snap=data.accountSnapshots[month]||(data.accountSnapshots[month]={});
  snap.revolutSubaccounts=snap.revolutSubaccounts||{};
  const label=target==="private"?"Revolut privé":target==="dealplug"?"DealPlugNL":"Crypto / Aandelen";
  const current=target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[target]||0);
  const next=direction==="remove"?current-n:current+n;
  if(next<0){notify(`Onvoldoende saldo op ${label}.`);return}
  if(target==="private") snap.acc4=next;
  else snap.revolutSubaccounts[target]=next;

  const tx={
    id:uid(),
    description:String(note||label).trim()||label,
    amount:n,
    date:today(),
    category:"Revolut mutatie",
    accountId:"revolut-subaccount",

    target,
    direction,
    note:String(note||"").trim(),
    month
  };
  data.transactions.push(tx);
  persist();
  render();
  notify(`${euro(n)} ${direction==="remove"?"afgehaald van":"toegevoegd aan"} ${label}.`);
}

function editTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
const val=prompt("Nieuw bedrag (€):",String(t.amount));
if(val===null)return;
const n=Number(val);if(!Number.isFinite(n)||n<=0){notify("Ongeldig bedrag.");return}
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  // Eerst de oude beweging terugdraaien op het actuele saldo.
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
  // Controleer daarna het nieuwe bedrag vanuit de herstelde actuele bron.
  const displayed=displayedAccountBalances(t.month);
  const sourceBefore=t.fromTarget==="private"
    ? Number(privateAccount?.balance||0)
    : t.fromTarget==="dealplug" ? Number(displayed.dealplug||0) : Number(displayed.crypto||0);
  if(sourceBefore<n){notify("Onvoldoende saldo voor dit nieuwe bedrag.");return}
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance-=n;
    if(t.toTarget==="private") privateAccount.balance+=n;
  }
  t.amount=n;
  persist();render();
  return;
}
if(t.kind==="revolutAdjustment"){
  const snap=data.accountSnapshots?.[t.month];
  if(snap){
    snap.revolutSubaccounts=snap.revolutSubaccounts||{};
    const current=t.target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[t.target]||0);
    const next=t.direction==="add"?current-t.amount:current+t.amount;
    if(t.target==="private")snap.acc4=Math.max(0,next);else snap.revolutSubaccounts[t.target]=Math.max(0,next);
  }
}else if(t.kind==="transfer"){const from=accountById(t.accountId),to=accountById(t.toAccountId);if(from)from.balance+=t.amount;if(to)to.balance-=t.amount
}else if(t.kind==="income"||t.kind==="expense"){
  const acc=accountById(t.accountId);
  if(acc && monthKey(new Date(t.date))===monthKey(new Date())){
    if(t.kind==="income") acc.balance-=Number(t.amount||0);
    else acc.balance+=Number(t.amount||0);
  }
}
data.transactions=data.transactions.filter(x=>x.id!==tid);saveAndRender();
}

function deleteTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
if(!confirm("Deze transactie verwijderen?"))return;
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
}else if(t.kind==="revolutAdjustment"){
  const snap=data.accountSnapshots?.[t.month];
  if(snap){
    snap.revolutSubaccounts=snap.revolutSubaccounts||{};
    const current=t.target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[t.target]||0);
    const next=t.direction==="add"?current-t.amount:current+t.amount;
    if(t.target==="private")snap.acc4=Math.max(0,next);else snap.revolutSubaccounts[t.target]=Math.max(0,next);
  }
}else if(t.kind==="transfer"){
  const from=accountById(t.accountId),to=accountById(t.toAccountId);
  if(from)from.balance+=t.amount;
  if(to)to.balance-=t.amount;
}else if(t.kind==="income"||t.kind==="expense"){
  const acc=accountById(t.accountId);
  if(acc && monthKey(new Date(t.date))===monthKey(new Date())){
    if(t.kind==="income") acc.balance-=Number(t.amount||0);
    else acc.balance+=Number(t.amount||0);
  }
}
data.transactions=data.transactions.filter(x=>x.id!==tid);saveAndRender();
}

let selectedSnapshotMonth="";

function dealplugNetForMonth(month){
  const entries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
  return entries.filter(e=>monthKey(e.date)===month).reduce((sum,e)=>{
    const amount=Number(e.amount||0);
    if(e.kind==="income") return sum+amount;
    if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return sum-amount;
    return sum;
  },0);
}
function dealplugBalanceForMonth(month,snapshot){
  return Number(snapshot?.revolutSubaccounts?.dealplug||0)+dealplugNetForMonth(month);
}
function revolutPrivateCurrentBalance(month){
  return Number(displayedAccountBalances(month).privateRevolut||0);
}

function revolutPrivateBalance(snapshot){
  // Gebruik de maandstand als die expliciet is opgeslagen. Als die nog niet
  // bestaat, gebruik dan het actuele Revolut-saldo uit de rekeninggegevens.
  if(snapshot && Object.prototype.hasOwnProperty.call(snapshot,"acc4")){
    return Number(snapshot.acc4||0);
  }
  const acc=accountById("acc4");
  return Number(acc?.balance||0);
}
function revolutSubTotal(snapshot,month){
  const subs=snapshot?.revolutSubaccounts||{};
  const dealplug=month?dealplugBalanceForMonth(month,snapshot):Number(subs.dealplug||0);
  return dealplug+Number(subs.crypto||0);
}
function revolutTotal(snapshot,month){
  return revolutPrivateBalance(snapshot)+revolutSubTotal(snapshot,month);
}

function processWeeklySalary(){
  const ws=data.weeklySalary;
  if(!ws || !ws.enabled || !(Number(ws.amount)>0)) return;
  const now=new Date();
  const day=now.getDay();
  if(day===0 || day===1 || day===2) return;

  // The salary belongs to this week's Wednesday. If the app is opened later
  // in the week, it is still added once for that Wednesday.
  const wednesday=new Date(now);
  wednesday.setDate(now.getDate()-(day-3));
  const dateKey=`${wednesday.getFullYear()}-${String(wednesday.getMonth()+1).padStart(2,"0")}-${String(wednesday.getDate()).padStart(2,"0")}`;
  const key=`salary_${dateKey}`;
  if(data.processedRecurring[key]) return;

  const acc=accountById(ws.accountId)||data.accounts[0];
  if(!acc) return;

  const amount=Number(ws.amount);
  data.transactions.push({
    id:uid(),
    description:ws.description||"Wekelijks loon",
    amount,
    date:dateKey,
    category:"Salaris",
    accountId:acc.id,
    kind:"income"
  });
  acc.balance+=amount;
  data.processedRecurring[key]=true;
  persist();
}

function downloadBackup(){
try{
const backup={app:"Budget Planner",version:2,createdAt:new Date().toISOString(),data:data};
const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=`BudgetPlanner-backup-${new Date().toISOString().slice(0,10)}.json`;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}catch(e){notify("De backup kon niet worden gemaakt.");}
}

function restoreBackup(file){
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const parsed=JSON.parse(reader.result);
const restored=parsed?.data||parsed;
if(!restored||typeof restored!=="object"||!Array.isArray(restored.accounts)||!Array.isArray(restored.transactions))throw new Error();
if(!confirm("Deze backup terugzetten? De huidige gegevens in deze browser worden vervangen."))return;
localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));
data=loadData();
render();
notify("Backup succesvol hersteld.");
}catch(e){notify("Dit bestand is geen geldige Budget Planner-backup.");}
};
reader.onerror=()=>notify("Het backupbestand kon niet worden gelezen.");
reader.readAsText(file);
}

function setupBackupControls(){
$("backupDownload").onclick=downloadBackup;
$("backupRestore").onclick=()=>$("backupFile").click();
$("backupFile").onchange=e=>{restoreBackup(e.target.files?.[0]);e.target.value="";};

const mobileBackup=$("mobileBackup");
const mobileMenu=$("mobileBackupMenu");
if(mobileBackup&&mobileMenu){
  mobileBackup.onclick=()=>{
    mobileMenu.style.display=mobileMenu.style.display==="none"?"block":"none";
  };
  $("mobileBackupDownload").onclick=()=>{
    downloadBackup();
    mobileMenu.style.display="none";
  };
  $("mobileBackupRestore").onclick=()=>{
    $("backupFile").click();
    mobileMenu.style.display="none";
  };
}
}

function init(){
processRecurringTransactions();
processWeeklySalary();
navEvents();
setupGlobalControls();
setupBackupControls();
render();
}
init();
</script>
</body>
